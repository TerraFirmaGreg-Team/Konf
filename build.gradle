plugins {
    alias(libs.plugins.spotless) apply false
}

allprojects {
    group = "${lib_package}"
    version = "${lib_version}"
}

subprojects { p ->
    if (p.name == 'modules') {
        return
    }
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'com.diffplug.spotless'

    base {
        archivesName = "konf-${project.name}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(findProperty('java_version') as String)
        }
        withSourcesJar()
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        compileOnly libs.jspecify

        implementation libs.slf4j.api

        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = (findProperty('java_version') as String).toInteger()
        options.compilerArgs << '-Xlint:deprecation'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    spotless {
        encoding 'UTF-8'
        java {
            target 'src/*/java/**/*.java'
            shortenFullyQualifiedTypes()
            removeUnusedImports()
            palantirJavaFormat(libs.versions.palantir.java.format.get()).formatJavadoc(true)
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('jar') {
        manifest {
            attributes(
                    'Implementation-Title': "konf-${project.name}",
                    'Implementation-Version': version,
                    'Automatic-Module-Name': "${lib_package}.${lib_name}${project.name == 'core' ? '' : '.' + project.name}"
            )
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                artifactId = "konf-${project.name}"
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/terrafirmagreg-team/konf')
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
