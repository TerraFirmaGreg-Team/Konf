plugins {
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.vanniktech.publish) apply false
}

allprojects {
    group = "${lib_package}"
    version = "${lib_version}"
}

subprojects { p ->
    if (p.name == 'modules') {
        return
    }
    apply plugin: 'java-library'
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'com.diffplug.spotless'

    base {
        archivesName = "konf-${project.name}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(findProperty('java_version') as String)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        compileOnly libs.jspecify

        implementation libs.slf4j.api

        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = (findProperty('java_version') as String).toInteger()
        options.compilerArgs << '-Xlint:deprecation'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.named('javadoc') {
        options.encoding = 'UTF-8'
        options.addBooleanOption('Xdoclint:none', true)
    }

    spotless {
        encoding 'UTF-8'
        java {
            target 'src/*/java/**/*.java'
            shortenFullyQualifiedTypes()
            removeUnusedImports()
            palantirJavaFormat(libs.versions.palantir.java.format.get()).formatJavadoc(true)
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    afterEvaluate {
        tasks.withType(Jar).configureEach {
            destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
        }
    }

    gradle.projectsEvaluated {
        tasks.matching { it.name == 'plainJavadocJar' }.configureEach {
            destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
        }
    }

    tasks.named('jar') {
        manifest {
            attributes(
                    'Implementation-Title': "konf-${project.name}",
                    'Implementation-Version': version,
                    'Automatic-Module-Name': "${lib_package}.${lib_name}${project.name == 'core' ? '' : '.' + project.name}"
            )
        }
    }

    mavenPublishing {
        coordinates("${findProperty('lib_package')}", "konf-${project.name}", "${findProperty('lib_version')}")

        publishToMavenCentral(true)
        signAllPublications()

        pom {
            name = "konf-${project.name}"
            description = findProperty('lib_description') as String
            url = findProperty('lib_url') as String
            licenses {
                license {
                    name = 'GNU Lesser General Public License v3.0'
                    url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'TerraFirmaGreg-Team'
                    name = findProperty('lib_authors') as String
                    url = 'https://github.com/TerraFirmaGreg-Team'
                }
            }
            scm {
                url = findProperty('lib_url') as String
                connection = 'scm:git:git://github.com/TerraFirmaGreg-Team/Konf.git'
                developerConnection = 'scm:git:ssh://git@github.com/TerraFirmaGreg-Team/Konf.git'
            }
        }
    }

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/terrafirmagreg-team/konf')
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
