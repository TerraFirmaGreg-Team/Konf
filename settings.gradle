pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "Konf"
include 'modules:core', 'modules:toml', 'modules:json', 'modules:hocon', 'modules:yaml'
