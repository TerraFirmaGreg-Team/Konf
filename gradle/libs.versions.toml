[versions]
lombok = "1.18.48"
junit = "6.1.3"
nightconfig = "3.9.0"
slf4j = "2.0.20"
jspecify = "1.0.1"
spotless = "8.10.4"
palantir-java-format = "2.102.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
nightconfig-core = { module = "com.electronwill.night-config:core", version.ref = "nightconfig" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightconfig" }
nightconfig-json = { module = "com.electronwill.night-config:json", version.ref = "nightconfig" }
nightconfig-hocon = { module = "com.electronwill.night-config:hocon", version.ref = "nightconfig" }
nightconfig-yaml = { module = "com.electronwill.night-config:yaml", version.ref = "nightconfig" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
